name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        working-directory: futapp-back
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: futapp-front/package-lock.json
      - name: Install dependencies
        working-directory: futapp-front
        run: npm ci
      - name: Lint
        working-directory: futapp-front
        run: npm run lint
      - name: Production build
        working-directory: futapp-front
        run: npm run build
