services:
  postgres:
    image: postgres:17-alpine
    container_name: futapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futapp}
      POSTGRES_USER: ${POSTGRES_USER:-futapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futapp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - futapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  futapp_postgres_data:
