services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futapp}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - futapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./futapp-back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-futapp}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      UPLOADS_DIRECTORY: /var/lib/futapp/uploads
      BETA_INVITE_CODE: ${BETA_INVITE_CODE}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      OPENAPI_ENABLED: "false"
      DEMO_DATA_ENABLED: "false"
      PASSWORD_RESET_EXPOSE_TOKEN: "false"
      PASSWORD_RESET_MAIL_ENABLED: "true"
    volumes:
      - futapp_uploads:/var/lib/futapp/uploads
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./futapp-front
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true

volumes:
  futapp_postgres_data:
  futapp_uploads:
