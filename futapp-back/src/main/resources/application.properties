spring.application.name=futapp
server.servlet.context-path=/api/v1

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/futapp}
spring.datasource.username=${DATABASE_USERNAME:futapp}
spring.datasource.password=${DATABASE_PASSWORD:futapp_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

futapp.demo-data.enabled=${DEMO_DATA_ENABLED:false}
futapp.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
futapp.legacy-h2-migration.enabled=${MIGRATE_H2_ENABLED:false}
futapp.legacy-h2-migration.url=${LEGACY_H2_URL:jdbc:h2:file:./data/futappdb}
futapp.uploads.directory=${UPLOADS_DIRECTORY:./data/uploads}
futapp.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/openapi
