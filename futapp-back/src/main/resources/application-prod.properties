spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.jpa.open-in-view=false

futapp.demo-data.enabled=false
futapp.password-reset.expose-token=false
futapp.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
futapp.uploads.directory=${UPLOADS_DIRECTORY}

server.error.include-message=never
server.forward-headers-strategy=framework
logging.level.root=INFO
logging.level.org.springframework.security=WARN
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
