spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.jpa.open-in-view=false

futapp.demo-data.enabled=false
futapp.password-reset.expose-token=false
futapp.password-reset.duration=30m
futapp.auth.cookie-secure=true
futapp.auth.expose-token=false
futapp.auth.login.maximum-failures=5
futapp.auth.login.lock-duration=15m
futapp.auth.session-duration=7d
futapp.auth.maximum-sessions=5
futapp.password-reset.mail-enabled=true
futapp.registration.invite-code=${BETA_INVITE_CODE}
futapp.public-url=${PUBLIC_URL}
futapp.mail.from=${MAIL_FROM}
futapp.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
futapp.uploads.directory=${UPLOADS_DIRECTORY}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework
logging.level.root=INFO
logging.level.org.springframework.security=WARN
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
